
name: Edu Video Renderer

on:
  workflow_dispatch:
    inputs:
      drive_file_id:
        description: "Google Drive ZIP File ID"
        required: true
        type: string

      quality:
        description: "Video Resolution"
        required: true
        type: choice
        options:
          - 1080p
          - 720p

      fps:
        description: "Video FPS"
        required: true
        type: choice
        options:
          - "30"
          - "60"

      output_name:
        description: "Output Video Name"
        required: true
        default: "video.mp4"
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install gdown
        run: pip install gdown

      - name: Download Google Drive ZIP
        run: |
          gdown "https://drive.google.com/uc?id=${{ inputs.drive_file_id }}" \
          -O project.zip

      - name: Extract ZIP
        run: |
          unzip -q project.zip
          if [ -d edu-video ]; then
            echo "PROJECT_DIR=edu-video" >> $GITHUB_ENV
          elif [ -d edu-motion-graphics/edu-video ]; then
            echo "PROJECT_DIR=edu-motion-graphics/edu-video" >> $GITHUB_ENV
          else
            echo "Project folder not found"
            exit 1
          fi

      - name: Install Dependencies
        run: npm install
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}

      - name: Setup Browser
        run: npx remotion browser ensure
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}

      - name: Render Video
        env:
          QUALITY: ${{ inputs.quality }}
          FPS: ${{ inputs.fps }}
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          mkdir -p out

          npx remotion render \
            src/index.ts \
            Root \
            "out/$OUTPUT_NAME" \
            --scale="$( [ "$QUALITY" = "1080p" ] && echo 1 || echo 0.666667 )" \
            --fps="$FPS"
        working-directory: ${{ github.workspace }}/${{ env.PROJECT_DIR }}

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: ${{ env.PROJECT_DIR }}/out/${{ inputs.output_name }}
          if-no-files-found: error
          retention-days: 7

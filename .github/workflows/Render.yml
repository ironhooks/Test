
name: Network Analysis - beIN Sports

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Capture Network Metadata
        run: |
          cat > analyze.py <<'PY'
          import asyncio
          import json
          from urllib.parse import urlparse
          from playwright.async_api import async_playwright

          TARGET = "https://cinewwchannels.pages.dev/bein1/"
          records = []

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch()
                  page = await browser.new_page()

                  page.on("response", lambda r: records.append({
                      "host": urlparse(r.url).hostname,
                      "resource_type": r.request.resource_type,
                      "status": r.status,
                      "content_type": r.headers.get("content-type", "")
                  }) if r.request.resource_type not in
                  ["media", "font"] else None)

                  try:
                      await page.goto(
                          TARGET,
                          wait_until="domcontentloaded",
                          timeout=60000
                      )
                      await page.wait_for_timeout(15000)
                  except Exception as e:
                      print("Navigation:", str(e))

                  report = {
                      "target": urlparse(TARGET).hostname,
                      "total_requests": len(records),
                      "requests": records
                  }

                  with open("network-report.json", "w") as f:
                      json.dump(report, f, indent=2)

                  await browser.close()

          asyncio.run(main())
          PY

          python analyze.py

      - name: Upload Network Report
        uses: actions/upload-artifact@v4
        with:
          name: network-analysis-report
          path: network-report.json
          if-no-files-found: error
          retention-days: 7

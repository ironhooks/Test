
name: Edu Motion Graphics Renderer

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: "Paste Full Google Drive ZIP URL"
        required: true
        type: string

jobs:
  render:
    name: Download and Render Video
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Node Setup
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Python Setup
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install Google Drive Downloader
      - name: Install Gdown
        run: |
          python -m pip install --upgrade gdown

      # Download ZIP
      - name: Download Project from Google Drive
        env:
          DRIVE_URL: ${{ inputs.drive_url }}
        run: |
          gdown "$DRIVE_URL" -O edu-motion-graphics.zip

          if [ ! -s edu-motion-graphics.zip ]; then
            echo "ERROR: ZIP download failed!"
            exit 1
          fi

          unzip -t edu-motion-graphics.zip

      # Extract ZIP
      - name: Extract Project
        run: |
          unzip -q edu-motion-graphics.zip

          if [ ! -f edu-video/package.json ]; then
            echo "ERROR: edu-video/package.json not found!"
            exit 1
          fi

          echo "PROJECT_DIR=edu-video" >> $GITHUB_ENV

      # Install Dependencies
      - name: Install Dependencies
        working-directory: ./edu-video
        run: npm install

      # Prepare Remotion Browser
      - name: Setup Remotion Browser
        working-directory: ./edu-video
        run: npx remotion browser ensure

      # Render Video
      - name: Render Education Video
        working-directory: ./edu-video
        run: |
          mkdir -p out
          npm run build

      # Verify Video
      - name: Verify Output
        run: |
          if [ ! -s edu-video/out/video.mp4 ]; then
            echo "ERROR: Video was not generated!"
            exit 1
          fi

          ls -lh edu-video/out/video.mp4

      # Upload Video
      - name: Upload Rendered Video
        uses: actions/upload-artifact@v4
        with:
          name: Education-Decline-Video
          path: edu-video/out/video.mp4
          if-no-files-found: error
          retention-days: 7

name: ZooPLAY Secure APK Builder

on:
  workflow_dispatch:
    inputs:
      google_drive_url:
        description: "Google Drive ZIP Source URL"
        required: true
        type: string

      release_tag:
        description: "GitHub Release Tag"
        required: true
        default: "v1.0.0"
        type: string

permissions:
  contents: write

concurrency:
  group: zooplay-release-build
  cancel-in-progress: false

jobs:
  build:
    name: Build and Sign ZooPLAY APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK Packages
        run: |
          set -euo pipefail

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;35.0.0"

      - name: Install Download Tools
        run: |
          python -m pip install --upgrade pip
          pip install gdown

      - name: Download Source ZIP
        env:
          DRIVE_URL: ${{ inputs.google_drive_url }}
        run: |
          set -euo pipefail

          if [ -z "$DRIVE_URL" ]; then
            echo "Google Drive URL missing"
            exit 1
          fi

          gdown "$DRIVE_URL" -O source.zip

          test -s source.zip
          unzip -tq source.zip

      - name: Extract Source Code
        run: |
          set -euo pipefail

          mkdir -p source
          unzip -q source.zip -d source

      - name: Locate Android Project
        run: |
          set -euo pipefail

          SETTINGS_FILE=$(find source \
            -type f \
            \( -name settings.gradle.kts \
            -o -name settings.gradle \) \
            -not -path "*/.gradle/*" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "App module not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "Gradle wrapper not found in project"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Wrapper
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"
          chmod +x ./gradlew

          ./gradlew --version

      - name: Build Release APK
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          ./gradlew assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Locate Release APK
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/release/*" \
            -name "*.apk" \
            ! -name "*-unsigned.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT_DIR" \
              -type f \
              -path "*/build/outputs/apk/release/*" \
              -name "*-unsigned.apk" \
              | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "Release APK not found"
            exit 1
          fi

          echo "INPUT_APK=$APK" >> "$GITHUB_ENV"

      - name: Sign Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ] || \
             [ -z "$KEYSTORE_PASSWORD" ] || \
             [ -z "$KEY_ALIAS" ] || \
             [ -z "$KEY_PASSWORD" ]; then
            echo "Missing release signing secrets"
            exit 1
          fi

          KEYSTORE="$RUNNER_TEMP/zooplay-release.jks"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > "$KEYSTORE"

          test -s "$KEYSTORE"

          keytool -list \
            -storetype JKS \
            -keystore "$KEYSTORE" \
            -storepass "$KEYSTORE_PASSWORD"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          mkdir -p signed

          "$BUILD_TOOLS/zipalign" \
            -f 4 \
            "$INPUT_APK" \
            "$RUNNER_TEMP/zooplay-aligned.apk"

          "$BUILD_TOOLS/zipalign" \
            -c -p 4 \
            "$RUNNER_TEMP/zooplay-aligned.apk"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-type JKS \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out signed/ZooPLAY-release.apk \
            "$RUNNER_TEMP/zooplay-aligned.apk"

          rm -f "$KEYSTORE"

          echo "Signing completed"

      - name: Verify APK Signature
        run: |
          set -euo pipefail

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" \
            verify \
            --verbose \
            --print-certs \
            signed/ZooPLAY-release.apk

          echo "APK signature verified successfully"

      - name: Generate SHA256
        run: |
          set -euo pipefail

          cd signed

          sha256sum ZooPLAY-release.apk > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZooPLAY-Signed-Release
          path: |
            signed/ZooPLAY-release.apk
            signed/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ZooPLAY Release ${{ inputs.release_tag }}
          body: |
            ZooPLAY First Release

            Version: 1.0.0
            Build Type: Release APK
            APK Signing: Enabled
            Signature Verification: Passed
            SHA256 Checksum: Included
          files: |
            signed/ZooPLAY-release.apk
            signed/SHA256SUMS.txt
          fail_on_unmatched_files: true
          make_latest: true

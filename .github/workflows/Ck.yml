name: one-account
on:
  schedule:
    - cron: "17,47 * * * *"      # ঘণ্টায় ২ বার
  workflow_dispatch:

concurrency:
  group: gmail-factory
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install patchright requests
          patchright install chromium
          patchright install-deps chromium

      - name: Create one account
        env:
          SMS_API_KEY: ${{ secrets.SMS_API_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          SMS_COUNTRY: ${{ vars.SMS_COUNTRY }}
        run: python create.py

      - name: Save result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-${{ github.run_id }}
          path: out/
          retention-days: 30
